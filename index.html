<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هم‌بازی | تخته‌نرد سه‌بعدی</title><style>*{box-sizing:border-box}body{margin:0;background:#101419;color:#f4efe6;font-family:Tahoma,Arial,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}header{position:fixed;top:0;right:0;left:0;z-index:2;padding:22px 30px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-1px}header p{font-size:11px;color:#b3b6b8;margin:6px 0} .tag{direction:ltr;border:1px solid #ffffff2a;background:#182027c9;border-radius:20px;padding:9px 13px;font-size:10px;letter-spacing:2px;color:#e0c69a}.panel{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:9px;align-items:center;padding:11px;border-radius:18px;border:1px solid #ffffff25;background:#131b23e8;box-shadow:0 12px 45px #0007;white-space:nowrap}button{border:1px solid #ffffff15;border-radius:10px;background:#293642;color:white;padding:12px 15px;cursor:pointer;font-family:inherit;font-size:13px}button:hover{background:#3d4c58}button.primary{background:#d9b77d;color:#181b1e;font-weight:800}button.primary:hover{background:#f0cd92}#notice{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:3;background:#141d25db;border:1px solid #ffffff22;border-radius:12px;padding:9px 15px;font-size:12px;text-align:center;max-width:95vw}#loader{position:fixed;inset:0;z-index:5;background:#101419;display:grid;place-items:center;text-align:center}#error{display:none;color:#ffc2ad;padding:20px}#hint{position:fixed;top:85px;right:30px;color:#c6bdaf;font-size:11px;z-index:2}@media(max-width:650px){header{padding:16px}h1{font-size:20px}.tag{font-size:8px;padding:8px}#hint{top:70px;right:16px}.panel{width:calc(100% - 18px);bottom:12px;gap:5px;justify-content:center;padding:7px}button{padding:11px 8px;font-size:11px}#notice{bottom:78px;font-size:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="scene"></div><header><div><h1>هم‌بازی</h1><p>تخته‌نرد سه‌بعدی • نسخه نمایشی حرفه‌ای</p></div><div class="tag">INTERACTIVE 3D DEMO</div></header><div id="hint">برای چرخش بکشید • برای زوم اسکرول کنید</div><div id="notice">برای دیدن حرکت، دکمه «حرکت نمایشی» را بزنید یا مهره روشن انتخاب کنید.</div><div class="panel"><button class="primary" id="roll">🎲 انداختن تاس</button><button id="move">حرکت نمایشی</button><button id="plus">＋</button><button id="minus">−</button><button id="reset">بازنشانی نما</button></div><div id="loader"><div><h2>هم‌بازی</h2><p>در حال آماده‌سازی سالن سه‌بعدی…</p><div id="error"></div></div></div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const root=document.getElementById('scene'),notice=document.getElementById('notice'),loader=document.getElementById('loader');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#171e24');scene.fog=new THREE.Fog('#171e24',19,36);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,90);camera.position.set(0,8.7,12.8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.85,0);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=5.8;controls.maxDistance=21;controls.maxPolarAngle=Math.PI/2.1;controls.minPolarAngle=.22;controls.update();
scene.add(new THREE.HemisphereLight(0xe5efff,0x544333,2.1));const key=new THREE.DirectionalLight(0xffe2b4,3.3);key.position.set(-5,10,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=12;key.shadow.camera.bottom=-12;key.shadow.bias=-.0004;scene.add(key);const fill=new THREE.PointLight(0x9bbce6,80,19);fill.position.set(5,6,-4);scene.add(fill);
const mat=(c,rough=.65,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});const walnut=mat('#65442e',.42),edge=mat('#b98c57',.34),felt=mat('#23443e',.91),ivory=mat('#f2e4c7',.25),black=mat('#22272c',.3),gold=mat('#bfa06c',.3,.45),lightTri=mat('#c5a273',.83),darkTri=mat('#8b503c',.85);
function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}
const floor=box(80,.15,80,mat('#2b3338',.9),0,-.16,0);floor.receiveShadow=true;const grid=new THREE.GridHelper(70,35,0x52616a,0x3a454d);grid.position.y=-.07;scene.add(grid);
// Subtle architectural backdrop and studio plinth
box(9,.4,7.3,mat('#20292f'),0,.2,0);box(8.4,.25,6.8,walnut,0,.52,0);box(8.15,.08,6.55,edge,0,.69,0);box(7.83,.035,6.23,felt,0,.75,0);
// 4 quadrants x 6 triangular points; center bar is kept clear
const W=7.6,D=6.0,halfW=3.8,bar=.33,pointW=(halfW-bar/2)/6,topY=.787;
const triangleGeo=(cx,zBase,zTip)=>{const shape=new THREE.Shape();shape.moveTo(cx-pointW*.47,-zBase);shape.lineTo(cx+pointW*.47,-zBase);shape.lineTo(cx,-zTip);shape.closePath();const g=new THREE.ShapeGeometry(shape);g.rotateX(-Math.PI/2);return g};
// Points numbered 0..23 in clockwise playing order: top right 0..5, top left 6..11, bottom left 12..17, bottom right 18..23
const pointCenters=[];for(let q=0;q<4;q++){for(let j=0;j<6;j++){const right=q===0||q===3;const top=q<2;const x=right?(bar/2+pointW*(j+.5)):(-bar/2-pointW*(j+.5));const z=top?-2.97:2.97;const tip=top?-.83:.83;const geom=triangleGeo(x,z,tip);const t=mesh(geom,(j+q*6)%2?lightTri:darkTri,0,topY,0);t.material.side=THREE.DoubleSide;pointCenters.push({x,z,top,tip});}}
// Center divider and inset trim
box(.27,.12,6.15,walnut,0,.84,0);box(.045,.02,6.1,gold,-.13,.91,0);box(.045,.02,6.1,gold,.13,.91,0);
for(const x of [-3.97,3.97])box(.13,.22,6.5,walnut,x,.84,0);for(const z of [-3.17,3.17])box(8.08,.22,.13,walnut,0,.84,z);
// 30 checkers in conventional opening distribution (2/5/3/5 each)
const stacks=[{p:0,n:2,c:'dark'},{p:5,n:5,c:'light'},{p:7,n:3,c:'light'},{p:11,n:5,c:'dark'},{p:12,n:5,c:'light'},{p:16,n:3,c:'dark'},{p:18,n:5,c:'dark'},{p:23,n:2,c:'light'}];
const checkers=[];const checkerGeo=new THREE.CylinderGeometry(.235,.235,.075,48);const ringGeo=new THREE.TorusGeometry(.177,.012,8,48);ringGeo.rotateX(Math.PI/2);
function checker(c,p,idx){const point=pointCenters[p];const dir=point.top?1:-1;const z=point.z+dir*(.35+idx*.51);const group=new THREE.Group();group.position.set(point.x,.85,z);scene.add(group);const body=mesh(checkerGeo,c==='light'?ivory:black,0,.045,0,group);const ring=mesh(ringGeo,c==='light'?gold:mat('#78858b',.4,.35),0,.09,0,group);body.userData.checker=group;ring.userData.checker=group;group.userData={color:c,point:p};checkers.push(group);return group}
for(const s of stacks)for(let i=0;i<s.n;i++)checker(s.c,s.p,i);
// Dice with actual pips on all six faces
const dice=[];const pip=mat('#1d2830',.3);function die(x,z){const g=new THREE.Group();g.position.set(x,1.04,z);scene.add(g);const cube=mesh(new THREE.BoxGeometry(.46,.46,.46),ivory,0,0,0,g);const pipR=.037;const layout={1:[[0,0]],2:[[-1,-1],[1,1]],3:[[-1,-1],[0,0],[1,1]],4:[[-1,-1],[-1,1],[1,-1],[1,1]],5:[[-1,-1],[-1,1],[0,0],[1,-1],[1,1]],6:[[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]};const faces=[{n:1,axis:'y',v:.235},{n:6,axis:'y',v:-.235},{n:2,axis:'x',v:.235},{n:5,axis:'x',v:-.235},{n:3,axis:'z',v:.235},{n:4,axis:'z',v:-.235}];for(const f of faces)for(const [a,b]of layout[f.n]){const o=mesh(new THREE.SphereGeometry(pipR,10,8),pip,0,0,0,g);if(f.axis==='y')o.position.set(a*.075,f.v,b*.075);if(f.axis==='x')o.position.set(f.v,a*.075,b*.075);if(f.axis==='z')o.position.set(a*.075,b*.075,f.v)}dice.push(g)}die(-.85,.25);die(.8,-.15);
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let selected=null,highlight=null,anim=null,rolling=0,turn=0;
function setNotice(s){notice.textContent=s}
const demoDestinations=[19,20,21,22,17,15,14,13,10,9,8,6];
function destination(){return demoDestinations[turn%demoDestinations.length]}
function destinationPosition(pointIndex){const p=pointCenters[pointIndex];const occupied=checkers.filter(c=>c!==selected&&c!==anim?.g&&c.userData.point===pointIndex).length;const dir=p.top?1:-1;return new THREE.Vector3(p.x,.85,p.z+dir*(.35+occupied*.51))}
function clearHighlight(){if(highlight){scene.remove(highlight);highlight.geometry.dispose();highlight.material.dispose();highlight=null}}
function selectChecker(g){if(anim)return;if(selected)selected.scale.setScalar(1);selected=g;g.scale.setScalar(1.12);clearHighlight();const to=destinationPosition(destination());highlight=mesh(new THREE.CylinderGeometry(.29,.29,.012,48),new THREE.MeshBasicMaterial({color:0x55edb5,transparent:true,opacity:.65}),to.x,.875,to.z);setNotice('مهره روشن انتخاب شد؛ روی نشان سبز یا دکمه حرکت نمایشی بزنید.')}
function moveSelected(){if(anim)return;let g=selected||checkers.find(c=>c.userData.color==='light');if(!g)return;selected=g;const dest=destination(),from=g.position.clone(),to=destinationPosition(dest);anim={g,from,to,start:performance.now(),dest};clearHighlight();setNotice('مهره در حال حرکت است…')}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);if(highlight&&ray.intersectObject(highlight).length){moveSelected();return}const hits=ray.intersectObjects(checkers,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData?.color)o=o.parent;if(o?.userData.color==='light')selectChecker(o);else setNotice('یک مهره روشن انتخاب کنید.')}});
document.getElementById('roll').onclick=()=>{rolling=performance.now()+1100;setNotice('تاس‌ها در حال چرخش هستند…')};document.getElementById('move').onclick=moveSelected;document.getElementById('reset').onclick=()=>{camera.position.set(0,8.7,12.8);controls.target.set(0,.85,0);controls.update()};document.getElementById('plus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(.8).add(controls.target)};document.getElementById('minus').onclick=()=>{camera.position.sub(controls.target).multiplyScalar(1.2).add(controls.target)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loader.remove();function loop(t){requestAnimationFrame(loop);if(rolling){if(t<rolling){dice.forEach((d,i)=>{d.rotation.x+=.17+i*.03;d.rotation.z+=.2+i*.02})}else{rolling=0;dice.forEach(d=>d.rotation.set(0,0,0));setNotice('تاس‌ها انداخته شدند؛ یک مهره روشن انتخاب کنید.')}}if(anim){const k=Math.min(1,(t-anim.start)/850),s=k*k*(3-2*k);anim.g.position.lerpVectors(anim.from,anim.to,s);anim.g.position.y=.85+Math.sin(Math.PI*s)*.9;if(k>=1){anim.g.position.copy(anim.to);anim.g.userData.point=anim.dest;anim.g.scale.setScalar(1);selected=null;anim=null;turn++;setNotice('مهره جابه‌جا شد! برای حرکت بعدی دوباره روی «حرکت نمایشی» بزنید.')}}controls.update();renderer.render(scene,camera)}requestAnimationFrame(loop);
}catch(e){console.error(e);document.getElementById('error').style.display='block';document.getElementById('error').textContent='خطا در بارگذاری سه‌بعدی: '+e.message;}
</script></body></html>
